# 静态默认数据（供模板使用；config 中的 [data] 会覆盖此处）
# 文件名须为 .chezmoidata.toml（chezmoi 特殊文件约定），不得改为 .tmpl。
# 详见 .chezmoi/chezmoi.toml 的 [data]
proxy = "http://127.0.0.1:7890"
proxy_host = "127.0.0.1"
proxy_port = "7890"
git_user_name = "xiaolitongxue666"
git_user_email = "leonpa1987@gmail.com"
# windows_git_bash_path / windows_git_icon_path / windows_git_connect_path：
# 勿在此写死 C:/ 路径；apply 时由 detect_windows_git_paths.sh + --override-data-file 注入
# （可在 ~/.config/chezmoi/chezmoi.toml.local 的 [data] 覆盖）
macos_connect_path = "/opt/homebrew/bin/connect"
macos_proxy_connect_opt = "-S"
# macos_zsh_path：**默认不设置** —— 由 dot_config/ghostty/config.tmpl 运行时探测
# command -v zsh（Intel 为 /usr/local/bin/zsh，Apple Silicon 为 /opt/homebrew/bin/zsh）。
# 如需强制指定，请在 ~/.config/chezmoi/chezmoi.toml.local 的 [data] 中覆盖；
# 不要在此写死，否则会覆盖掉另一架构机器的正确探测结果（2026-09 修复）。
identity_file = "~/.ssh/id_rsa"
# Cursor Remote SSH：见 agent-config config/local.env.example
